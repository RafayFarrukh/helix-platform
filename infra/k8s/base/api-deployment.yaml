# The API deployment. Every choice here exists to make the platform survivable:
# multiple replicas, spread across zones, drained gracefully, never restarted
# because a dependency blipped, and never able to consume a node's whole memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-api
  labels: { app: helix-api, tier: api }
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 2, maxUnavailable: 0 }   # never lose capacity mid-deploy
  selector:
    matchLabels: { app: helix-api }
  template:
    metadata:
      labels: { app: helix-api, tier: api }
    spec:
      # Spread replicas across availability zones so losing one zone loses a
      # third of capacity, not all of it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: helix-api }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/helix/api:__TAG__
          ports: [{ containerPort: 4000, name: http }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: NODE_ENV
              value: production
            - name: REGION
              valueFrom: { fieldRef: { fieldPath: metadata.labels['topology.kubernetes.io/region'] } }
          envFrom:
            - secretRef: { name: helix-api-secrets }
            - configMapRef: { name: helix-api-config }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2000m", memory: "1Gi" }
          # Liveness never touches the database: a database blip must not turn
          # into a cluster-wide restart storm.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness does check dependencies, so an unhealthy replica is drained
          # from the load balancer instead of returning errors.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }   # let the LB stop sending traffic first
      terminationGracePeriodSeconds: 45
