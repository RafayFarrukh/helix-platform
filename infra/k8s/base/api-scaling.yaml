# Autoscaling is driven by request concurrency, not CPU alone: an API that is
# waiting on the database is not busy by CPU but is absolutely at capacity.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: helix-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: helix-api }
  minReplicas: 6
  maxReplicas: 120
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Pods
      pods:
        metric: { name: http_requests_in_flight }
        target: { type: AverageValue, averageValue: "40" }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30       # react fast to a traffic spike
      policies: [{ type: Percent, value: 100, periodSeconds: 30 }]
    scaleDown:
      stabilizationWindowSeconds: 300      # shrink slowly, avoid flapping
      policies: [{ type: Percent, value: 20, periodSeconds: 60 }]
---
# A rollout or node drain can never take the service below quorum.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: helix-api
spec:
  minAvailable: 75%
  selector:
    matchLabels: { app: helix-api }
